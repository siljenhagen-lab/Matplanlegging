<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matplanlegging</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#3f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matplanlegging">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a22; --muted:#6b756d; --line:#e3e0d6;
  --accent:#3f6b4a; --accent-ink:#ffffff; --soft:#e7efe8; --warn:#b5651d; --warn-soft:#fbeedd;
  --danger:#b3392f; --danger-soft:#f9e4e1; --bar:#d8d4c7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a16; --card:#1f2620; --ink:#e8ece6; --muted:#9aa59c; --line:#323b33;
    --accent:#7fb48d; --accent-ink:#0f1a12; --soft:#263429; --warn:#e3a35f; --warn-soft:#3a2e1f;
    --danger:#e57a6f; --danger-soft:#3b2421; --bar:#3a443b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a16; --card:#1f2620; --ink:#e8ece6; --muted:#9aa59c; --line:#323b33;
  --accent:#7fb48d; --accent-ink:#0f1a12; --soft:#263429; --warn:#e3a35f; --warn-soft:#3a2e1f;
  --danger:#e57a6f; --danger-soft:#3b2421; --bar:#3a443b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:720px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ask p{margin:0;white-space:pre-line}
#ask textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.card h2{margin:0;padding:12px 14px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap}
.grp{padding:7px 14px;font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);border-top:1px solid var(--line)}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;display:block}
.sub{font-size:13px;color:var(--muted)}
.bar{height:5px;background:var(--bar);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.low i{background:var(--warn)}
.bar.empty i{background:var(--danger)}
.qty{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.qty small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;cursor:pointer;flex:none}
.round.plus{background:var(--soft);border-color:transparent;color:var(--accent)}
.round:active{transform:scale(.94)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:150px}
input[type=text],input[type=search],input[type=number],select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600;vertical-align:1px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.empty{background:var(--danger-soft);color:var(--danger)}
.empty-state{text-align:center;padding:28px 16px;color:var(--muted)}
.empty-state .btn{margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.row input.list-amt{width:72px;flex:none;text-align:right;padding:8px 10px}
.check{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.monthbar strong{font-size:18px;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.pos{color:var(--accent)} .neg{color:var(--warn)}
.undo{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:18px}
.dlg-body{padding:14px 16px;display:grid;gap:12px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.quick{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--soft);padding:10px;border-radius:12px}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 14px}
.day{min-height:68px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.day b{font-size:13px;font-variant-numeric:tabular-nums}
.day span{font-size:10.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;hyphens:auto}
.day.has{background:var(--soft);border-color:transparent}
.day.has span{color:var(--accent);font-weight:600}
.day.away{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--line) 6px 7px);color:var(--muted)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day.past:not(.has){opacity:.55}
.day.cooked b{color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 32px;gap:6px;align-items:center}
.ing .ing-cat{grid-column:1 / -1}
.ing input,.ing select{padding:8px}
.steps{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
@media (max-width:380px){.round{width:38px;height:38px}.qty{min-width:48px}}
</style>
</head>
<body>
<header>
  <h1 id="title">Lager</h1>
  <p id="subtitle"></p>
</header>
<main id="view"></main>

<nav>
  <button data-tab="plan" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="middager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9v4M2 4v6a2 2 0 0 0 2 2M4 4v16M22 4c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v7"/></svg>Middager</button>
  <button data-tab="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Handleliste</button>
  <button data-tab="lager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7M8 3h8l1 4H7z"/></svg>Lager</button>
  <button data-tab="mer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mer</button>
</nav>

<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div id="toast"><span id="toast-msg"></span><button id="toast-undo">Angre</button></div>

<script>
'use strict';

/* ---------- Konstanter ---------- */
const KEY = 'matlager.v1';
const CATS = [
  { id: 'torr',    name: 'Tørrvarer',          mode: 'mnd' },
  { id: 'herm',    name: 'Hermetikk og glass', mode: 'mnd' },
  { id: 'kjott',   name: 'Kjøtt og kylling',   mode: 'mnd' },
  { id: 'fisk',    name: 'Fisk og sjømat',     mode: 'mnd' },
  { id: 'brod',    name: 'Brød og bakst',      mode: 'mnd' },
  { id: 'frys',    name: 'Annen frossenmat',   mode: 'mnd' },
  { id: 'kjol',    name: 'Meieri og egg',      mode: 'behov' },
  { id: 'frukt',   name: 'Frukt og grønt',     mode: 'behov' },
  { id: 'krydder', name: 'Krydder og sauser',  mode: 'mnd' },
  { id: 'drikke',  name: 'Drikke',             mode: 'mnd' },
  { id: 'hush',    name: 'Husholdning',        mode: 'mnd' },
  { id: 'annet',   name: 'Annet',              mode: 'mnd' },
];
const UNITS = ['stk', 'pk', 'boks', 'pose', 'flaske', 'kg', 'g', 'l', 'dl', 'rull'];
const DECIMAL_UNITS = ['kg', 'l'];
const DAY = 864e5;
const STARTER = [
  ['Pasta','torr','pk',4], ['Ris','torr','pk',2], ['Havregryn','torr','pk',2], ['Hvetemel','torr','kg',2],
  ['Sukker','torr','kg',1], ['Kaffe','torr','pk',3], ['Knekkebrød','torr','pk',2],
  ['Hermetiske tomater','herm','boks',6], ['Kokosmelk','herm','boks',2], ['Syltetøy','herm','stk',1],
  ['Kjøttdeig','kjott','pk',6], ['Kyllingfilet','kjott','pk',4], ['Pølser','kjott','pk',2],
  ['Laks','fisk','pk',2], ['Fiskepinner','fisk','pk',2], ['Brød','brod','stk',4], ['Pizza','frys','stk',2],
  ['Melk','kjol','l',3], ['Smør','kjol','pk',1], ['Ost','kjol','stk',1], ['Egg','kjol','pk',1], ['Yoghurt','kjol','stk',4],
  ['Poteter','frukt','kg',2], ['Løk','frukt','stk',4], ['Gulrøtter','frukt','pose',1], ['Epler','frukt','stk',6], ['Bananer','frukt','stk',6],
  ['Ketchup','krydder','flaske',1], ['Buljong','krydder','pk',1],
  ['Toalettpapir','hush','pk',1], ['Oppvaskmiddel','hush','flaske',1], ['Vaskemiddel','hush','pk',1],
];

/* ---------- Lagring ---------- */
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { items: d.items || [], log: d.log || [], draft: d.draft || {}, dinners: d.dinners || [], plan: d.plan || {}, extras: d.extras || [], settings: d.settings || {} };
    }
  } catch (e) { /* tom start */ }
  return { items: [], log: [], draft: {}, dinners: [], plan: {}, extras: [], settings: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Klarte ikke å lagre på denne enheten.'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Hjelpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const item = id => S.items.find(i => i.id === id);
const round2 = n => Math.round(n * 100) / 100;
const fmt = n => round2(n).toLocaleString('nb-NO', { maximumFractionDigits: 2 });
const roundUp = (n, unit) => DECIMAL_UNITS.includes(unit) ? Math.ceil(n * 2) / 2 : Math.ceil(n - 1e-9);
const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthName = key => { const [y, m] = key.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('nb-NO', { month: 'long', year: 'numeric' }); };
const shiftMonth = (key, n) => { const [y, m] = key.split('-'); return monthKey(new Date(+y, +m - 1 + n, 1)); };
const dateStr = ts => new Date(ts).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
const byName = (a, b) => a.name.localeCompare(b.name, 'nb');

/* Gjennomsnittlig forbruk per 30 dager, basert på de siste 90 dagene
   (eller kortere hvis varen er nyere enn det). */
function monthlyUse(id) {
  const now = Date.now(), from = now - 90 * DAY;
  const entries = S.log.filter(e => e.item === id);
  if (!entries.length) return 0;
  const first = Math.min(...entries.map(e => e.ts));
  const days = Math.max(30, Math.min(90, (now - first) / DAY));
  const used = entries.filter(e => e.type === 'bruk' && e.ts >= from).reduce((s, e) => s - e.delta, 0);
  return used / days * 30;
}

function status(it) {
  if (it.qty <= 0) return 'empty';
  if (it.target > 0 && it.qty < it.target) return 'low';
  return 'ok';
}

/* ---------- Endringer i beholdning ---------- */
let lastEntry = null;
function change(id, type, amount, silent) {
  const it = item(id);
  if (!it || !amount) return;
  let delta;
  if (type === 'kjøp') delta = amount;
  else if (type === 'bruk') delta = -Math.min(amount, it.qty);
  else delta = amount - it.qty; // justering: amount = ny beholdning
  delta = round2(delta);
  if (!delta) { if (type === 'bruk' && !silent) toast(`${it.name} er allerede tom`); return; }
  it.qty = round2(it.qty + delta);
  const e = { id: uid(), item: id, type, delta, ts: Date.now() };
  S.log.push(e);
  save();
  if (!silent) {
    lastEntry = e;
    const verb = type === 'kjøp' ? 'Kjøpt' : type === 'bruk' ? 'Brukt' : 'Justert';
    toast(`${verb} ${fmt(Math.abs(delta))} ${it.unit} ${it.name}`, true);
  }
  return e;
}
function undoEntry(entryId) {
  const idx = S.log.findIndex(e => e.id === entryId);
  if (idx < 0) return;
  const e = S.log[idx], it = item(e.item);
  if (it) it.qty = Math.max(0, round2(it.qty - e.delta));
  S.log.splice(idx, 1);
  save();
}

/* ---------- Egne dialoger (erstatter confirm/prompt) ---------- */
function ask(msg, okLabel = 'OK', danger = false) {
  const d = $('#ask');
  d.innerHTML = `<div class="dlg-body"><p>${esc(msg)}</p></div>
    <div class="dlg-foot"><button class="btn" id="ask-no">Avbryt</button><button class="btn ${danger ? 'danger' : 'primary'}" id="ask-yes">${esc(okLabel)}</button></div>`;
  return new Promise(res => {
    const done = v => { d.close(); res(v); };
    $('#ask-no').onclick = () => done(false);
    $('#ask-yes').onclick = () => done(true);
    d.oncancel = () => res(false);
    d.showModal();
  });
}
function showText(title, text) {
  const d = $('#ask');
  d.innerHTML = `<div class="dlg-head"><h3>${esc(title)}</h3><button class="x" id="ask-x" aria-label="Lukk">×</button></div>
    <div class="dlg-body"><textarea id="ask-text" readonly></textarea></div>
    <div class="dlg-foot"><button class="btn primary" id="ask-copy">Kopier</button></div>`;
  $('#ask-text').value = text;
  $('#ask-x').onclick = () => d.close();
  $('#ask-copy').onclick = () => {
    const t = $('#ask-text');
    navigator.clipboard.writeText(text).then(() => { d.close(); toast('Kopiert'); })
      .catch(() => { t.focus(); t.select(); toast('Merk teksten er valgt. Kopier den manuelt.'); });
  };
  d.showModal();
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undoable) {
  $('#toast-msg').textContent = msg;
  $('#toast-undo').style.display = undoable ? '' : 'none';
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
}
$('#toast-undo').onclick = () => {
  if (lastEntry) { undoEntry(lastEntry.id); lastEntry = null; }
  $('#toast').classList.remove('show');
  render();
};

/* ---------- Navigasjon ---------- */
let tab = 'plan';
let filter = { q: '', low: false };
let histMonth = monthKey(Date.now());
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  go(b.dataset.tab);
});
function go(t) {
  tab = t;
  const navTab = t === 'historikk' ? 'mer' : t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === navTab));
  window.scrollTo(0, 0);
  render();
}

function render() {
  const views = { plan: viewPlan, middager: viewMiddager, lager: viewLager, liste: viewListe, historikk: viewHistorikk, mer: viewMer };
  views[tab]();
}

/* ---------- Lager ---------- */
function viewLager() {
  const low = S.items.filter(i => status(i) !== 'ok').length;
  $('#title').textContent = 'Lager';
  $('#subtitle').textContent = S.items.length
    ? `${S.items.length} varer · ${low ? low + ' under ønsket mengde' : 'alt på plass'}`
    : 'Hva har du i skap og skuffer?';

  if (!S.items.length) {
    $('#view').innerHTML = `
      <div class="card empty-state">
        <p><b>Lageret er tomt.</b><br>Legg inn varene du pleier å ha hjemme. Antall settes til 0, så fyller du på når du handler.</p>
        <button class="btn primary" id="starter">Start med vanlige varer</button><br>
        <button class="btn" id="add-first">Legg til én og én vare</button>
      </div>`;
    $('#starter').onclick = () => {
      STARTER.forEach(([name, c, unit, target]) => S.items.push({ id: uid(), name, cat: c, unit, target, qty: 0, mode: cat(c).mode }));
      save(); render();
      toast('Varer lagt til. Trykk på et navn for å endre eller slette.');
    };
    $('#add-first').onclick = () => openItem();
    return;
  }

  const q = filter.q.trim().toLowerCase();
  const list = S.items.filter(i => (!q || i.name.toLowerCase().includes(q)) && (!filter.low || status(i) !== 'ok'));
  let html = `
    <div class="toolbar">
      <input type="search" id="q" placeholder="Søk etter vare" value="${esc(filter.q)}" autocomplete="off">
      <button class="btn primary" id="add">+ Ny vare</button>
    </div>
    <div class="chips">
      <button class="chip ${filter.low ? '' : 'on'}" data-low="0">Alle</button>
      <button class="chip ${filter.low ? 'on' : ''}" data-low="1">Lite igjen (${low})</button>
    </div>`;
  for (const c of CATS) {
    const rows = list.filter(i => i.cat === c.id).sort(byName);
    if (!rows.length) continue;
    html += `<section class="card"><h2>${c.name}</h2>` + rows.map(rowLager).join('') + `</section>`;
  }
  if (!list.length) html += `<div class="card empty-state">Ingen varer passer søket.</div>`;
  $('#view').innerHTML = html;

  const qi = $('#q');
  qi.oninput = () => { filter.q = qi.value; const pos = qi.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#add').onclick = () => openItem(null, filter.q.trim());
  document.querySelectorAll('[data-low]').forEach(b => b.onclick = () => { filter.low = b.dataset.low === '1'; render(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openItem(b.dataset.open));
  document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { change(b.dataset.use, 'bruk', 1); render(); });
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { change(b.dataset.buy, 'kjøp', 1); render(); });
}
function rowLager(i) {
  const st = status(i);
  const pct = i.target > 0 ? Math.min(100, i.qty / i.target * 100) : (i.qty > 0 ? 100 : 0);
  const tag = st === 'empty' ? '<span class="tag empty">Tomt</span>' : st === 'low' ? '<span class="tag warn">Lite</span>' : '';
  const modeTxt = i.mode === 'behov' ? 'ved behov' : 'månedshandel';
  return `<div class="row">
    <div class="grow">
      <button class="name" data-open="${i.id}">${esc(i.name)} ${tag}</button>
      <div class="sub">${i.target ? 'Ønsket ' + fmt(i.target) + ' ' + esc(i.unit) + ' · ' : ''}${modeTxt}</div>
      <div class="bar ${st === 'ok' ? '' : st}"><i style="width:${pct}%"></i></div>
    </div>
    <button class="round" data-use="${i.id}" aria-label="Brukt én ${esc(i.unit)} ${esc(i.name)}">−</button>
    <div class="qty">${fmt(i.qty)}<small>${esc(i.unit)}</small></div>
    <button class="round plus" data-buy="${i.id}" aria-label="Kjøpt én ${esc(i.unit)} ${esc(i.name)}">+</button>
  </div>`;
}

          <label class="f">Enhet<select id="unit">${[...new Set([...UNITS, d.unit])].map(u => `<option ${u === d.unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></label>
        </div>
        <div class="f" style="display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600">Handles
          <div class="seg" id="mode">
            <button type="button" data-m="mnd" class="${d.mode === 'mnd' ? 'on' : ''}">Månedshandel</button>
            <button type="button" data-m="behov" class="${d.mode === 'behov' ? 'on' : ''}">Ved behov</button>
          </div>
        </div>
        <div class="two">
          <label class="f">Ønsket på lager<input type="number" id="target" inputmode="decimal" min="0" step="any" value="${d.target || ''}" placeholder="0"></label>
          <label class="f">${it ? 'Tell opp (antall nå)' : 'Har nå'}<input type="number" id="qty" inputmode="decimal" min="0" step="any" value="${d.qty}"></label>
        </div>
        <p class="hint" id="mode-hint" style="margin:0"></p>
        ${recent.length ? `<div><div class="sub" style="font-weight:600;margin-bottom:4px">Siste registreringer</div>${recent.map(e =>
          `<div class="sub">${dateStr(e.ts)} · ${e.type} <span class="${e.delta > 0 ? 'pos' : 'neg'}">${e.delta > 0 ? '+' : ''}${fmt(e.delta)}</span></div>`).join('')}</div>` : ''}
      </div>
      <div class="dlg-foot">
        ${it ? '<button type="button" class="btn danger" id="del" style="margin-right:auto">Slett</button>' : ''}
        <button type="button" class="btn" id="cancel">Avbryt</button>
        <button type="submit" class="btn primary">Lagre</button>
      </div>
    </form>`;

  let mode = d.mode, modeTouched = !!it;
  const hint = () => $('#mode-hint').textContent = mode === 'mnd'
    ? 'Ønsket på lager = hvor mye du vil ha ved starten av måneden. Handlelisten foreslår mer hvis du bruker mer enn dette.'
    : 'Ønsket på lager = når du har mindre enn dette, havner varen på påfyll-listen.';
  hint();
  dlg.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    mode = b.dataset.m; modeTouched = true;
    dlg.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); hint();
  });
  $('#cat').onchange = () => {
    if (modeTouched) return;
    mode = cat($('#cat').value).mode;
    dlg.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x.dataset.m === mode)); hint();
  };
  const close = () => dlg.close();
  $('#close').onclick = close; $('#cancel').onclick = close;

  if (it) {
    const quick = type => {
      const a = parseFloat($('#amt').value);
      if (!(a > 0)) return;
      change(it.id, type, a); close(); render();
    };
    $('#q-use').onclick = () => quick('bruk');
    $('#q-buy').onclick = () => quick('kjøp');
    $('#del').onclick = async () => {
      if (!await ask(`Slette «${it.name}» og historikken for varen?`, 'Slett', true)) return;
      S.items = S.items.filter(x => x.id !== it.id);
      S.log = S.log.filter(e => e.item !== it.id);
      S.dinners.forEach(dn => dn.ings = dn.ings.filter(g => g.item !== it.id));
      delete S.draft[it.id];

    ev.preventDefault();

      const n = { id: uid(), name, cat: $('#cat').value, unit: $('#unit').value, target, qty: 0, mode };
      S.items.push(n);
      if (qty > 0) change(n.id, 'kjøp', qty, true);
    }
    save(); close(); render();
  };
  dlg.showModal();
  if (!it) $('#name').focus();
}

/* ---------- Middagsplan: hjelpere ---------- */
const WEEKDAYS = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn'];
const dinner = id => S.dinners.find(d => d.id === id);
const daysIn = key => { const [y, m] = key.split('-'); return new Date(+y, +m, 0).getDate(); };
const dayDate = (key, d) => { const [y, m] = key.split('-'); return new Date(+y, +m - 1, d); };
const todayStart = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const getDay = (key, d) => (S.plan[key] && S.plan[key][d]) || {};
function setDay(key, d, patch) {
  const m = S.plan[key] || (S.plan[key] = {});
  const v = { ...(m[d] || {}), ...patch };
  for (const k of Object.keys(v)) if (!v[k]) delete v[k];
  if (Object.keys(v).length) m[d] = v; else delete m[d];
  save();
}
// Etter den 20. planlegger man som regel neste måned
let planMonth = (() => { const t = new Date(); return t.getDate() >= 20 ? shiftMonth(monthKey(t), 1) : monthKey(t); })();
let planMode = 'middag';
let listMode = 'handle';

/* Hvor mye av hver vare middagene trenger mellom to datoer (begge med).
   Middager som er merket som laget er allerede trukket fra lageret. */
function planNeed(from, to) {
  const need = {};
  for (const t = new Date(from); t <= to; t.setDate(t.getDate() + 1)) {
    const day = getDay(monthKey(t), t.getDate());
    if (day.away || day.cooked || !day.dinner) continue;
    const dn = dinner(day.dinner);
    if (!dn) continue;
    for (const g of dn.ings) need[g.item] = (need[g.item] || 0) + g.amt;
  }
  return need;
}
function monthPlanNeed() {
  const start = dayDate(planMonth, 1), end = dayDate(planMonth, daysIn(planMonth)), t = todayStart();
  return planNeed(start < t ? t : start, end);
}
function weekPlanNeed() {
  const t = todayStart(), e = new Date(t);
  e.setDate(e.getDate() + 6);
  return planNeed(t, e);
}

function findOrCreateItem(name, c, unit) {
  const key = name.trim().toLowerCase();
  let it = S.items.find(i => i.name.toLowerCase() === key);
  if (!it) {
    it = { id: uid(), name: name.trim(), cat: c, unit, target: 0, qty: 0, mode: cat(c).mode };
    S.items.push(it);
  }
  return it;
}

const STARTER_DINNERS = [

  ['Spaghetti bolognese', [['Kjøttdeig', 'kjott', 'pk', 1], ['Pasta', 'torr', 'pk', 1], ['Hermetiske tomater', 'herm', 'boks', 2], ['Løk', 'frukt', 'stk', 1]]],
  ['Fiskepinner med poteter', [['Fiskepinner', 'fisk', 'pk', 1], ['Poteter', 'frukt', 'kg', 1], ['Gulrøtter', 'frukt', 'pose', 1]]],
  ['Laks i ovn', [['Laks', 'fisk', 'pk', 1], ['Poteter', 'frukt', 'kg', 1], ['Brokkoli', 'frukt', 'stk', 1]]],
  ['Kyllinggryte med ris', [['Kyllingfilet', 'kjott', 'pk', 1], ['Kokosmelk', 'herm', 'boks', 1], ['Ris', 'torr', 'pk', 0.5], ['Løk', 'frukt', 'stk', 1]]],
  ['Pølser i lompe', [['Pølser', 'kjott', 'pk', 1], ['Lomper', 'brod', 'pk', 1]]],
  ['Pizza', [['Pizza', 'frys', 'stk', 2]]],
];

/* ---------- Plan ---------- */
function viewPlan() {
  const key = planMonth, n = daysIn(key);
  const days = Array.from({ length: n }, (_, k) => k + 1);
  const home = days.filter(d => !getDay(key, d).away);
  const planned = home.filter(d => getDay(key, d).dinner || getDay(key, d).note);
  $('#title').textContent = 'Plan';
  $('#subtitle').textContent = `${home.length} dager hjemme · ${planned.length} ${planned.length === 1 ? 'middag' : 'middager'} planlagt`;

  const offset = (dayDate(key, 1).getDay() + 6) % 7;
  const today = todayStart().getTime();
  let cal = '<div class="wd">' + WEEKDAYS.map(w => `<span>${w}</span>`).join('') + '</div><div class="cal">' + '<span></span>'.repeat(offset);
  for (const d of days) {
    const day = getDay(key, d), dn = day.dinner && dinner(day.dinner), t = dayDate(key, d).getTime();
    const label = day.away ? 'Borte' : dn ? dn.name : day.note || '';
    const cls = ['day', day.away && 'away', !day.away && label && 'has', t === today && 'today', t < today && 'past', day.cooked && 'cooked'].filter(Boolean).join(' ');
    cal += `<button class="${cls}" data-day="${d}" aria-label="${d}. ${esc(label || 'ingen plan')}"><b>${d}${day.cooked ? ' ✓' : ''}</b><span>${esc(label)}</span></button>`;
  }
  cal += '</div>';

  const counts = {};
  for (const d of home) { const id = getDay(key, d).dinner; if (id && dinner(id)) counts[id] = (counts[id] || 0) + 1; }
  const summary = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([id, c]) => `<div class="row"><div class="grow">${esc(dinner(id).name)}</div><b>${c}×</b></div>`).join('');
  const open = home.filter(d => dayDate(key, d) >= todayStart() && !getDay(key, d).dinner && !getDay(key, d).note).length;

  $('#view').innerHTML = `
    <div class="monthbar">
      <button class="btn small" id="prev" aria-label="Forrige måned">‹</button>
      <strong>${monthName(key)}</strong>
      <button class="btn small" id="nextm" aria-label="Neste måned">›</button>
    </div>
    <div class="steps">
      <button class="chip ${planMode === 'borte' ? 'on' : ''}" data-mode="borte">Merk bortedager</button>
      <button class="chip ${planMode === 'middag' ? 'on' : ''}" data-mode="middag">Velg middager</button>
      <button class="chip" id="to-list">Handleliste →</button>
    </div>
    <p class="hint">${planMode === 'borte'
      ? 'Trykk på dagene dere er borte. Trykk igjen for å angre.'
      : S.dinners.length ? 'Trykk på en dag for å velge middag.' : 'Legg først inn middagene dere pleier å lage under <b>Middager</b>. Du kan også skrive fritt på en dag.'}</p>
    ${cal}
    <section class="card"><h2>Middager i ${monthName(key).split(' ')[0]}<span>${open > 0 ? open + ' dager uten middag' : ''}</span></h2>
      ${summary || '<div class="row sub">Ingen middager valgt ennå.</div>'}
    </section>`;

  $('#prev').onclick = () => { planMonth = shiftMonth(planMonth, -1); render(); };
  $('#nextm').onclick = () => { planMonth = shiftMonth(planMonth, 1); render(); };
  $('#to-list').onclick = () => go('liste');
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { planMode = b.dataset.mode; render(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const d = +b.dataset.day;
    if (planMode === 'borte') {
      const day = getDay(key, d);
      if (day.cooked) return toast('Middagen er registrert som laget. Angre det først.');
      setDay(key, d, { away: !day.away });
      render();
    } else openDay(d);
  });
}

function openDay(d) {
  const key = planMonth, day = getDay(key, d), dn = day.dinner && dinner(day.dinner);
  const date = dayDate(key, d);
  const t0 = date.toLocaleDateString('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' });
  const title = t0.charAt(0).toUpperCase() + t0.slice(1);
  const canCook = dn && !day.cooked && !day.away && date <= new Date();
  const dlg = $('#dlg');
  dlg.innerHTML = `
    <div class="dlg-head"><h3>${esc(title)}</h3><button type="button" class="x" id="close" aria-label="Lukk">×</button></div>
    <div class="dlg-body">
      ${day.cooked ? `<p class="sub" style="margin:0">✓ <b>${esc(dn ? dn.name : 'Middagen')}</b> er laget, og ingrediensene er trukket fra lageret.</p>` : `
      <div class="seg">
        <button type="button" data-away="0" class="${day.away ? '' : 'on'}">Hjemme</button>
        <button type="button" data-away="1" class="${day.away ? 'on' : ''}">Borte</button>
      </div>
      ${day.away ? '' : `
      <div class="pick">${S.dinners.slice().sort(byName).map(x => `<button type="button" class="chip ${x.id === day.dinner ? 'on' : ''}" data-dn="${x.id}">${esc(x.name)}</button>`).join('')
        || '<span class="sub">Ingen middager lagt inn ennå.</span>'}</div>
      <label class="f">Eller skriv noe annet (rester, ute, …)<input type="text" id="note" value="${esc(day.note || '')}" autocomplete="off"></label>
      ${dn ? `<div class="sub">Ingredienser: ${dn.ings.map(g => { const it = item(g.item); return it ? `${esc(it.name)} ${fmt(g.amt)} ${esc(it.unit)}` : ''; }).filter(Boolean).join(', ') || 'ingen lagt inn'}</div>` : ''}`}`}
    </div>
    <div class="dlg-foot">
      ${day.cooked ? '<button type="button" class="btn" id="uncook">Angre «laget»</button>' : ''}
      ${canCook ? '<button type="button" class="btn primary" id="cook">Middagen er laget</button>' : ''}
      ${!day.cooked && (day.dinner || day.note) ? '<button type="button" class="btn" id="clear">Fjern</button>' : ''}
      <button type="button" class="btn" id="done">Ferdig</button>
    </div>`;
  const close = () => { dlg.close(); render(); };
  $('#close').onclick = close; $('#done').onclick = close;
  dlg.querySelectorAll('[data-away]').forEach(b => b.onclick = () => { setDay(key, d, { away: b.dataset.away === '1' }); openDay(d); });
  dlg.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { setDay(key, d, { dinner: b.dataset.dn, note: '' }); close(); });
  const note = $('#note');
  if (note) note.onchange = () => { setDay(key, d, { note: note.value.trim(), dinner: note.value.trim() ? '' : day.dinner }); };
  if ($('#clear')) $('#clear').onclick = () => { setDay(key, d, { dinner: '', note: '' }); close(); };
  if ($('#cook')) $('#cook').onclick = () => {
    const ids = dn.ings.map(g => change(g.item, 'bruk', g.amt, true)).filter(Boolean).map(e => e.id);
    setDay(key, d, { cooked: ids.length ? ids : true });
    toast(ids.length ? `${dn.name} er registrert. ${ids.length} ${ids.length === 1 ? 'vare' : 'varer'} trukket fra lageret.`
      : `${dn.name} er registrert. Lageret hadde ingen av ingrediensene, så ingenting ble trukket fra.`);
    close();
  };
  if ($('#uncook')) $('#uncook').onclick = () => {
    if (Array.isArray(day.cooked)) day.cooked.forEach(undoEntry);
    setDay(key, d, { cooked: '' });
    close();
  };
  dlg.onclose = () => render();
  dlg.showModal();
}

/* ---------- Middager ---------- */
function viewMiddager() {
  $('#title').textContent = 'Middager';
  $('#subtitle').textContent = 'Vanlige middager og hva de trenger';
  if (!S.dinners.length) {
    $('#view').innerHTML = `
      <div class="card empty-state">
        <p><b>Ingen middager ennå.</b><br>Legg inn middagene dere pleier å lage, med ingrediensene de trenger. Da kan appen regne ut handlelisten fra middagsplanen.</p>
        <button class="btn primary" id="seed">Start med vanlige middager</button><br>
        <button class="btn" id="add-first">Legg inn egen middag</button>
      </div>`;
    $('#seed').onclick = () => {
      for (const [name, ings] of STARTER_DINNERS) {
        S.dinners.push({ id: uid(), name, ings: ings.map(([n, c, u, amt]) => ({ item: findOrCreateItem(n, c, u).id, amt })) });
      }
      save(); render();
      toast('Middager lagt til. Trykk på en for å endre den.');
    };
    $('#add-first').onclick = () => openDinner();
    return;
  }
  const used = {};
  for (const d of Object.values(S.plan[planMonth] || {})) if (d.dinner && !d.away) used[d.dinner] = (used[d.dinner] || 0) + 1;
  $('#view').innerHTML = `
    <div class="toolbar"><button class="btn primary" id="add">+ Ny middag</button></div>
    <section class="card"><h2>Middager<span>${S.dinners.length}</span></h2>
    ${S.dinners.slice().sort(byName).map(dn => `<div class="row">
      <div class="grow">
        <button class="name" data-dinner="${dn.id}">${esc(dn.name)}${used[dn.id] ? ` <span class="tag">${used[dn.id]}× i ${monthName(planMonth).split(' ')[0]}</span>` : ''}</button>
        <div class="sub">${dn.ings.map(g => { const it = item(g.item); return it ? `${esc(it.name)} ${fmt(g.amt)} ${esc(it.unit)}` : ''; }).filter(Boolean).join(' · ') || 'Ingen ingredienser'}</div>
      </div></div>`).join('')}
    </section>`;
  $('#add').onclick = () => openDinner();
  document.querySelectorAll('[data-dinner]').forEach(b => b.onclick = () => openDinner(b.dataset.dinner));
}

function openDinner(id) {
  const dn = id ? dinner(id) : null;
  let rows = dn ? dn.ings.map(g => { const it = item(g.item); return it ? { name: it.name, amt: g.amt, unit: it.unit, cat: it.cat } : null; }).filter(Boolean) : [];
  if (!rows.length) rows.push({ name: '', amt: 1, unit: 'stk', cat: 'annet' });
  const dlg = $('#dlg');
  const match = name => S.items.find(i => i.name.toLowerCase() === name.trim().toLowerCase());
  const rowHtml = (r, k) => {
    const it = match(r.name);
    return `<div class="ing" data-k="${k}">
      <input type="text" class="ing-name" list="itemlist" value="${esc(r.name)}" placeholder="Ingrediens" aria-label="Ingrediens" autocomplete="off">
      <input type="number" class="ing-amt" inputmode="decimal" min="0" step="any" value="${r.amt}" aria-label="Mengde">
      <select class="ing-unit" aria-label="Enhet" ${it ? 'disabled' : ''}>${[...new Set([...UNITS, it ? it.unit : r.unit])].map(u => `<option ${u === (it ? it.unit : r.unit) ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
      <button type="button" class="x ing-del" aria-label="Fjern ingrediens">×</button>
      <select class="ing-cat" aria-label="Kategori for ny vare" ${it || !r.name.trim() ? 'hidden' : ''}>${CATS.map(c => `<option value="${c.id}" ${c.id === r.cat ? 'selected' : ''}>Ny vare i: ${c.name}</option>`).join('')}</select>
    </div>`;
  };
  dlg.innerHTML = `
    <form id="f">
      <div class="dlg-head"><h3>${dn ? esc(dn.name) : 'Ny middag'}</h3><button type="button" class="x" id="close" aria-label="Lukk">×</button></div>
      <div class="dlg-body">
        <label class="f">Navn på middagen<input type="text" id="name" required value="${esc(dn ? dn.name : '')}" autocomplete="off"></label>
        <div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600">Ingredienser (mengde per gang)
          <div id="ings" style="display:grid;gap:8px"></div>
        </div>
        <button type="button" class="btn small" id="add-ing" style="justify-self:start">+ Ingrediens</button>
        <p class="hint" style="margin:0">Skriv navnet på en vare fra lageret, eller et nytt navn. Nye varer legges til på lageret når du lagrer.</p>
        <datalist id="itemlist">${S.items.slice().sort(byName).map(i => `<option value="${esc(i.name)}">`).join('')}</datalist>
      </div>
      <div class="dlg-foot">
        ${dn ? '<button type="button" class="btn danger" id="del" style="margin-right:auto">Slett</button>' : ''}
        <button type="button" class="btn" id="cancel">Avbryt</button>
        <button type="submit" class="btn primary">Lagre</button>
      </div>
    </form>`;

  const read = () => [...dlg.querySelectorAll('.ing')].map(el => ({
    name: el.querySelector('.ing-name').value,
    amt: parseFloat(el.querySelector('.ing-amt').value) || 0,
    unit: el.querySelector('.ing-unit').value,
    cat: el.querySelector('.ing-cat').value,
  }));
  const draw = () => {
    $('#ings').innerHTML = rows.map(rowHtml).join('');
    dlg.querySelectorAll('.ing').forEach(el => {
      const k = +el.dataset.k;
      el.querySelector('.ing-del').onclick = () => { rows = read(); rows.splice(k, 1); if (!rows.length) rows.push({ name: '', amt: 1, unit: 'stk', cat: 'annet' }); draw(); };
      el.querySelector('.ing-name').onchange = ev => {
        const it = match(ev.target.value), unit = el.querySelector('.ing-unit');
        if (it) { if (![...unit.options].some(o => o.value === it.unit)) unit.add(new Option(it.unit)); unit.value = it.unit; }
        unit.disabled = !!it;
        el.querySelector('.ing-cat').hidden = !!it || !ev.target.value.trim();
      };
    });
  };
  draw();
  $('#add-ing').onclick = () => {
    rows = read(); rows.push({ name: '', amt: 1, unit: 'stk', cat: 'annet' }); draw();
    const last = [...dlg.querySelectorAll('.ing-name')].pop(); if (last) last.focus();
  };
  const close = () => dlg.close();
  $('#close').onclick = close; $('#cancel').onclick = close;
  if (dn) $('#del').onclick = async () => {
    if (!await ask(`Slette middagen «${dn.name}»? Den fjernes også fra kalenderen.`, 'Slett', true)) return;
    S.dinners = S.dinners.filter(x => x.id !== dn.id);
    for (const m of Object.values(S.plan)) for (const d of Object.values(m)) if (d.dinner === dn.id) delete d.dinner;
    save(); render();
  };
  $('#f').onsubmit = ev => {
    ev.preventDefault();
    const name = $('#name').value.trim();
    if (!name) return;
    const ings = read().filter(r => r.name.trim() && r.amt > 0)
      .map(r => ({ item: findOrCreateItem(r.name, r.cat, r.unit).id, amt: r.amt }));
    if (dn) Object.assign(dn, { name, ings });
    else S.dinners.push({ id: uid(), name, ings });
    save(); close(); render();
  };
  dlg.showModal();
  if (!dn) $('#name').focus();
}

/* ---------- Handleliste ---------- */
function suggestions() {
  const mnd = [], behov = [];
  const month = monthPlanNeed(), week = weekPlanNeed();
  for (const i of S.items) {
    if (i.mode === 'behov') {
      const p7 = week[i.id] || 0;
      if ((i.target > 0 && i.qty < i.target) || p7 > i.qty) {
        const amt = roundUp(Math.max(1, Math.max(i.target, p7) - i.qty), i.unit);
        const why = (i.qty <= 0 ? 'tomt' : `${fmt(i.qty)} igjen`) + (p7 ? ` · middager neste 7 dager: ${fmt(p7)}` : '');
        behov.push({ i, amt, why });
      }
    } else {
      const avg = monthlyUse(i.id), plan = month[i.id] || 0;
      const want = Math.max(i.target, avg, plan);
      if (want - i.qty > 0.01) {
        const why = plan >= want ? `middagsplanen trenger ${fmt(plan)}` : avg >= want ? `bruker ca. ${fmt(avg)}/mnd` : `ønsket ${fmt(i.target)}`;
        mnd.push({ i, amt: roundUp(want - i.qty, i.unit), why: `${why}, har ${fmt(i.qty)}` });
      }
    }
  }
  return { mnd, behov, month };
}
function viewListe() {
  const { mnd, behov, month } = suggestions();
  $('#title').textContent = 'Handleliste';
  $('#subtitle').textContent = `For ${monthName(planMonth)}`;

  const draft = r => S.draft[r.i.id] || { on: false, amt: r.amt };
  const grouped = (rows, rowFn) => CATS.map(c => ({ c, rows: rows.filter(r => r.i.cat === c.id).sort((a, b) => byName(a.i, b.i)) }))
    .filter(g => g.rows.length).map(g => `<div class="grp">${g.c.name}</div>` + g.rows.map(rowFn).join('')).join('');
  const steps = `<div class="steps">
      <button class="chip ${listMode === 'sjekk' ? 'on' : ''}" data-lm="sjekk">Sjekk skapene</button>
      <button class="chip ${listMode === 'handle' ? 'on' : ''}" data-lm="handle">Handleliste</button>
    </div>`;
  const planDays = Object.values(S.plan[planMonth] || {}).filter(d => d.dinner && !d.away && !d.cooked).length;
  const planNote = planDays
    ? `Bygger på <b>${planDays} planlagte middager</b> i ${monthName(planMonth).split(' ')[0]}, det du ønsker å ha på lager og det du har brukt de siste tre månedene.`
    : `Ingen middager er planlagt for ${monthName(planMonth).split(' ')[0]} ennå. Listen bygger på ønsket lager og forbruk. Planlegg middager under <b>Plan</b> for en mer presis liste.`;

  if (listMode === 'sjekk') {
    const ids = new Set([...mnd, ...behov].map(r => r.i.id).concat(Object.keys(month)));
    const rows = [...ids].map(id => item(id)).filter(Boolean).map(i => ({ i }));
    $('#view').innerHTML = `${steps}
      <p class="hint">Gå gjennom skap, fryser og kjøleskap. Skriv inn hvor mye du faktisk har hvis tallet ikke stemmer. Handlelisten regnes ut på nytt.</p>
      <section class="card"><h2>Har nå<span>${rows.length} varer</span></h2>
      ${rows.length ? grouped(rows, r => `<div class="row">
        <div class="grow"><span class="name" style="cursor:default">${esc(r.i.name)}</span>
        <div class="sub">${month[r.i.id] ? `middagene trenger ${fmt(month[r.i.id])} · ` : ''}${r.i.target ? `ønsket ${fmt(r.i.target)}` : ''}</div></div>
        <input type="number" class="list-amt" inputmode="decimal" min="0" step="any" data-have="${r.i.id}" value="${r.i.qty}" aria-label="Har nå av ${esc(r.i.name)}">
        <span class="sub" style="width:42px">${esc(r.i.unit)}</span>
      </div>`) : '<div class="row sub">Ingenting å sjekke.</div>'}
      </section>
      <button class="btn primary" id="checked-done" style="width:100%">Ferdig, vis handlelisten</button>`;
    document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { listMode = b.dataset.lm; render(); });
    document.querySelectorAll('[data-have]').forEach(inp => inp.onchange = () => {
      change(inp.dataset.have, 'justering', Math.max(0, parseFloat(inp.value) || 0), true);
      delete S.draft[inp.dataset.have];
      save();
    });
    $('#checked-done').onclick = () => { listMode = 'handle'; render(); window.scrollTo(0, 0); };
    return;
  }

  // Én felles radmodell for forslag og egne tillegg
  const toRow = r => ({ key: r.i.id, itemId: r.i.id, name: r.i.name, unit: r.i.unit, cat: r.i.cat, why: r.why, amt: r.amt });
  const extraRows = S.extras.map(x => {
    const it = x.item && item(x.item);
    return { key: 'x:' + x.id, extraId: x.id, itemId: it ? it.id : null, name: it ? it.name : x.name, unit: it ? it.unit : x.unit, cat: it ? it.cat : 'annet', why: 'lagt til selv', amt: x.amt };
  });
  const mndRows = mnd.map(toRow), behovRows = behov.map(toRow);
  const all = [...mndRows, ...behovRows, ...extraRows];
  const view = S.settings.listView || 'oppdelt';
  const draftOf = r => S.draft[r.key] || { on: false, amt: r.amt };
  const byCat = rows => CATS.map(c => ({ c, rows: rows.filter(r => r.cat === c.id).sort((a, b) => a.name.localeCompare(b.name, 'nb')) })).filter(g => g.rows.length);
  const rowHtml = r => {
    const d = draftOf(r);
    return `<div class="row ${d.on ? 'done' : ''}">
      <input type="checkbox" class="check" data-chk="${esc(r.key)}" ${d.on ? 'checked' : ''} aria-label="Lagt i kurven">
      <div class="grow"><span class="name" style="cursor:default">${esc(r.name)}</span><div class="sub">${esc(r.why)}</div></div>
      <input type="number" class="list-amt" inputmode="decimal" min="0" step="any" data-amt="${esc(r.key)}" value="${d.amt}" aria-label="Antall">
      <span class="sub" style="width:42px">${esc(r.unit)}</span>
      ${r.extraId ? `<button class="x" data-rmx="${r.extraId}" aria-label="Fjern fra listen">×</button>` : ''}
    </div>`;
  };
  const section = (title, rows, note) => rows.length
    ? `<section class="card"><h2>${title}<span>${rows.length}</span></h2>` + byCat(rows).map(g => `<div class="grp">${g.c.name}</div>` + g.rows.map(rowHtml).join('')).join('') + `</section>`
    : note ? `<section class="card"><h2>${title}</h2><div class="row sub">${note}</div></section>` : '';
  const lists = view === 'enkelt'
    ? section('Handleliste', all, 'Ingenting på listen ennå. Legg til varer under.')
    : section('Månedshandel', mndRows, 'Du har nok av alt du månedshandler.')
      + section('Fylles på ved behov', behovRows, 'Ingen meieri, frukt eller grønt trengs den neste uken.')
      + section('Lagt til selv', extraRows, '');

  const checked = all.filter(r => S.draft[r.key]?.on).length;
  $('#view').innerHTML = `${steps}
    <div class="seg" style="margin:0 0 12px" role="group" aria-label="Visning">
      <button type="button" data-view="oppdelt" class="${view === 'oppdelt' ? 'on' : ''}">Oppdelt liste</button>
      <button type="button" data-view="enkelt" class="${view === 'enkelt' ? 'on' : ''}">Enkeltliste</button>
    </div>
    <p class="hint">${planNote} Kryss av det du legger i kurven, og trykk <b>Registrer innkjøp</b> når du er hjemme.</p>
    <div class="toolbar">
      <button class="btn" id="share" ${all.length ? '' : 'disabled'}>Del / kopier liste</button>
      <button class="btn primary" id="register" ${checked ? '' : 'disabled'}>Registrer innkjøp (${checked})</button>
    </div>
    ${lists}
    <section class="card"><h2>Legg til på listen</h2>
      <form id="xform" class="row" style="flex-wrap:wrap">
        <input type="text" id="x-name" list="x-items" placeholder="F.eks. bursdagskake, batterier" autocomplete="off" style="flex:1 1 160px" aria-label="Vare">
        <input type="number" id="x-amt" inputmode="decimal" min="0" step="any" value="1" style="width:64px;flex:none" aria-label="Antall">
        <select id="x-unit" style="width:84px;flex:none" aria-label="Enhet">${UNITS.map(u => `<option>${u}</option>`).join('')}</select>
        <button class="btn primary" type="submit">Legg til</button>
        <datalist id="x-items">${S.items.slice().sort(byName).map(i => `<option value="${esc(i.name)}">`).join('')}</datalist>
      </form>
      <div class="row sub" style="border-top:0;padding-top:0">Varer som finnes på lageret, legges inn på lageret når du registrerer innkjøpet.</div>
    </section>
  `;

  const byKey = Object.fromEntries(all.map(r => [r.key, r]));
  const setDraft = (key, patch) => { S.draft[key] = { ...draftOf(byKey[key]), ...patch }; save(); };
  document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { listMode = b.dataset.lm; render(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.settings.listView = b.dataset.view; save(); render(); });
  document.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { setDraft(c.dataset.chk, { on: c.checked }); render(); });
  document.querySelectorAll('[data-amt]').forEach(inp => inp.onchange = () => setDraft(inp.dataset.amt, { amt: Math.max(0, parseFloat(inp.value) || 0) }));
  document.querySelectorAll('[data-rmx]').forEach(b => b.onclick = () => {
    S.extras = S.extras.filter(x => x.id !== b.dataset.rmx);
    delete S.draft['x:' + b.dataset.rmx];
    save(); render();
  });
  const matchItem = name => S.items.find(i => i.name.toLowerCase() === name.trim().toLowerCase());
  $('#x-name').onchange = () => { const it = matchItem($('#x-name').value); if (it) { const u = $('#x-unit'); if (![...u.options].some(o => o.value === it.unit)) u.add(new Option(it.unit)); u.value = it.unit; } };
  $('#xform').onsubmit = ev => {
    ev.preventDefault();
    const name = $('#x-name').value.trim();
    if (!name) return;
    const it = matchItem(name);
    S.extras.push({ id: uid(), name, amt: Math.max(0, parseFloat($('#x-amt').value) || 1), unit: it ? it.unit : $('#x-unit').value, item: it ? it.id : null });
    save(); render();
    toast(`${name} er lagt til på listen`);
    $('#x-name').focus();
  };

  $('#register').onclick = () => {
    let n = 0;
    for (const r of all) {
      const d = S.draft[r.key];
      if (!d?.on) continue;
      if (r.itemId && d.amt > 0) change(r.itemId, 'kjøp', d.amt, true);
      if (r.extraId) S.extras = S.extras.filter(x => x.id !== r.extraId);
      n++;
    }
    for (const r of all) delete S.draft[r.key];
    save(); render();
    toast(`${n} ${n === 1 ? 'vare' : 'varer'} registrert som kjøpt`);
  };
  $('#share').onclick = async () => {
    const lines = [`Handleliste – ${monthName(planMonth)}`];
    const add = (title, rows) => {
      if (!rows.length) return;
      if (title) lines.push('', '== ' + title.toUpperCase() + ' ==');
      for (const g of byCat(rows)) {
        lines.push('', g.c.name + ':');
        g.rows.forEach(r => lines.push(`☐ ${r.name} – ${fmt(draftOf(r).amt)} ${r.unit}`));
      }
    };
    if (view === 'enkelt') add('', all);
    else { add('Månedshandel', mndRows); add('Ved behov', behovRows); add('Lagt til selv', extraRows); }
    const text = lines.join('\n');
    if (navigator.share) {
      try { await navigator.share({ title: 'Handleliste', text }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    showText('Handleliste', text);
  };
}

/* ---------- Historikk ---------- */
function viewHistorikk() {
  $('#title').textContent = 'Historikk';
  $('#subtitle').textContent = 'Hva ble kjøpt og brukt hver måned';
  const entries = S.log.filter(e => monthKey(e.ts) === histMonth);
  const per = {};
  for (const e of entries) {
    const p = per[e.item] || (per[e.item] = { kjøpt: 0, brukt: 0 });
    if (e.type === 'kjøp') p.kjøpt += e.delta;
    else if (e.type === 'bruk') p.brukt -= e.delta;
  }
  const rows = Object.entries(per).map(([id, p]) => ({ it: item(id), ...p })).filter(r => r.it && (r.kjøpt || r.brukt))
    .sort((a, b) => b.brukt - a.brukt || byName(a.it, b.it));
  const isNow = histMonth === monthKey(Date.now());
  const recent = entries.slice().reverse().slice(0, 30);

  $('#view').innerHTML = `
    <div class="monthbar">
      <button class="btn small" id="prev" aria-label="Forrige måned">‹</button>
      <strong>${monthName(histMonth)}</strong>
      <button class="btn small" id="nextm" ${isNow ? 'disabled' : ''} aria-label="Neste måned">›</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${rows.filter(r => r.kjøpt).length}</b><span>varer kjøpt</span></div>
      <div class="stat"><b>${rows.filter(r => r.brukt).length}</b><span>varer brukt</span></div>
      <div class="stat"><b>${entries.length}</b><span>registreringer</span></div>
    </div>
    ${rows.length ? `<section class="card"><h2>Per vare</h2>
      <table><thead><tr><th>Vare</th><th>Kjøpt</th><th>Brukt</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.it.name)}</td><td class="pos">${r.kjøpt ? fmt(r.kjøpt) + ' ' + esc(r.it.unit) : '–'}</td><td class="neg">${r.brukt ? fmt(r.brukt) + ' ' + esc(r.it.unit) : '–'}</td></tr>`).join('')}
      </tbody></table></section>` : `<div class="card empty-state">Ingen registreringer i ${monthName(histMonth)}.</div>`}
    ${recent.length ? `<section class="card"><h2>Siste registreringer</h2>
      ${recent.map(e => { const it = item(e.item); return it ? `<div class="row">
        <div class="grow"><div>${esc(it.name)} <span class="${e.delta > 0 ? 'pos' : 'neg'}">${e.delta > 0 ? '+' : ''}${fmt(e.delta)} ${esc(it.unit)}</span></div>
        <div class="sub">${dateStr(e.ts)} · ${e.type}</div></div>
        <button class="undo" data-undo="${e.id}">Angre</button></div>` : ''; }).join('')}
    </section>` : ''}`;

  $('#prev').onclick = () => { histMonth = shiftMonth(histMonth, -1); render(); };
  $('#nextm').onclick = () => { histMonth = shiftMonth(histMonth, 1); render(); };
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    if (!await ask('Angre denne registreringen? Beholdningen endres tilbake.', 'Angre')) return;
    undoEntry(b.dataset.undo); render();
  });
}

    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!Array.isArray(d.items) || !Array.isArray(d.log)) throw new Error('format');
      if (!await ask(`Erstatte dagens data med kopien (${d.items.length} varer)?`, 'Erstatt', true)) return;
      S = { items: d.items, log: d.log, draft: d.draft || {}, dinners: d.dinners || [], plan: d.plan || {}, extras: d.extras || [], settings: d.settings || {} };
      save(); toast('Kopien er hentet inn'); go('plan');
    } catch (e) { toast('Filen kunne ikke leses som en Matplanlegging-kopi.'); }
  };
  $('#wipe').onclick = async () => {
    if (!await ask('Slette alle varer og all historikk? Dette kan ikke angres.', 'Slett alt', true)) return;
    S = { items: [], log: [], draft: {}, dinners: [], plan: {}, extras: [], settings: {} }; save(); render();
  };
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
</body>
</html>
