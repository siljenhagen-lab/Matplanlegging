<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matplanlegging</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#3f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matplanlegging">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a22; --muted:#6b756d; --line:#e3e0d6;
  --accent:#3f6b4a; --accent-ink:#ffffff; --soft:#e7efe8; --warn:#b5651d; --warn-soft:#fbeedd;
  --danger:#b3392f; --danger-soft:#f9e4e1; --bar:#d8d4c7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a16; --card:#1f2620; --ink:#e8ece6; --muted:#9aa59c; --line:#323b33;
    --accent:#7fb48d; --accent-ink:#0f1a12; --soft:#263429; --warn:#e3a35f; --warn-soft:#3a2e1f;
    --danger:#e57a6f; --danger-soft:#3b2421; --bar:#3a443b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a16; --card:#1f2620; --ink:#e8ece6; --muted:#9aa59c; --line:#323b33;
  --accent:#7fb48d; --accent-ink:#0f1a12; --soft:#263429; --warn:#e3a35f; --warn-soft:#3a2e1f;
  --danger:#e57a6f; --danger-soft:#3b2421; --bar:#3a443b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:720px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ask p{margin:0;white-space:pre-line}
#ask textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.card h2{margin:0;padding:12px 14px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap}
.grp{padding:7px 14px;font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);border-top:1px solid var(--line)}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;display:block}
.sub{font-size:13px;color:var(--muted)}
.bar{height:5px;background:var(--bar);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.low i{background:var(--warn)}
.bar.empty i{background:var(--danger)}
.qty{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.qty small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;cursor:pointer;flex:none}
.round.plus{background:var(--soft);border-color:transparent;color:var(--accent)}
.round:active{transform:scale(.94)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:150px}
input[type=text],input[type=search],input[type=number],select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600;vertical-align:1px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.empty{background:var(--danger-soft);color:var(--danger)}
.empty-state{text-align:center;padding:28px 16px;color:var(--muted)}
.empty-state .btn{margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.row input.list-amt{width:72px;flex:none;text-align:right;padding:8px 10px}
.check{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.monthbar strong{font-size:18px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.pos{color:var(--accent)} .neg{color:var(--warn)}
.undo{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:18px}
.dlg-body{padding:14px 16px;display:grid;gap:12px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.quick{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--soft);padding:10px;border-radius:12px}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 14px}
.day{min-height:68px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.day b{font-size:13px;font-variant-numeric:tabular-nums}
.day span{font-size:10.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;hyphens:auto}
.day.has{background:var(--soft);border-color:transparent}
.day.has span{color:var(--accent);font-weight:600}
.day.away{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--line) 6px 7px);color:var(--muted)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day.past:not(.has){opacity:.55}
.day.cooked b{color:var(--accent)}
.week .wkday{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;min-height:60px}
.week .wkday:first-child{border-top:0}
.wd-name{display:grid;width:86px;flex:none}
.wd-name small{color:var(--muted);font-size:13px}
.wd-dinner{font-weight:600}
.wd-dinner i{font-weight:400;color:var(--muted)}
.wkday.has .wd-dinner{color:var(--accent)}
.wkday.away{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--line) 6px 7px)}
.wkday.away .wd-dinner{color:var(--muted);font-weight:400;font-style:italic}
.wkday.today{box-shadow:inset 4px 0 0 var(--accent)}
.wkday.past:not(.has){opacity:.6}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.sub b.hit{color:var(--accent)}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 32px;gap:6px;align-items:center}
.ing .ing-cat{grid-column:1 / -1}
.ing input,.ing select{padding:8px}
.steps{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important;padding:0!important;color:#000}
  body > *:not(#print){display:none!important}
  #print{display:block}
  #print h1{font-size:22pt;margin:0 0 4mm}
  #print table{width:100%;border-collapse:collapse;table-layout:fixed}
  #print th{font-size:10pt;text-transform:uppercase;letter-spacing:.06em;color:#444;padding:1.5mm;border:0;text-align:left}
  #print td{border:.3mm solid #888;vertical-align:top;padding:1.5mm 2mm;text-align:left;font-variant-numeric:normal}
  #print td b{display:block;font-size:10pt;color:#555}
  #print td span{display:block;font-size:13pt;font-weight:600;line-height:1.2;margin-top:1mm;overflow-wrap:anywhere}
  #print td.away{background:#eee;color:#777}
  #print td.away span{font-weight:400;font-style:italic}
  #print td.empty{border:0}
  #print p{font-size:9pt;color:#777;margin:3mm 0 0}
}
@media (max-width:380px){.round{width:38px;height:38px}.qty{min-width:48px}}
</style>
</head>
<body>
<header>
  <h1 id="title">Lager</h1>
  <p id="subtitle"></p>
</header>
<main id="view"></main>

<nav>
  <button data-tab="plan" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="middager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9v4M2 4v6a2 2 0 0 0 2 2M4 4v16M22 4c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v7"/></svg>Middagstips</button>
  <button data-tab="liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Handleliste</button>
  <button data-tab="lager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7M8 3h8l1 4H7z"/></svg>Lager</button>
  <button data-tab="mer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mer</button>
</nav>

<div id="print"></div>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div id="toast"><span id="toast-msg"></span><button id="toast-undo">Angre</button></div>

<script>
'use strict';

/* ---------- Konstanter ---------- */
const KEY = 'matlager.v1';
const CATS = [
  { id: 'torr',    name: 'Tørrvarer',          mode: 'mnd' },
  { id: 'herm',    name: 'Hermetikk og glass', mode: 'mnd' },
  { id: 'kjott',   name: 'Kjøtt og kylling',   mode: 'mnd' },
  { id: 'fisk',    name: 'Fisk og sjømat',     mode: 'mnd' },
  { id: 'brod',    name: 'Brød og bakst',      mode: 'mnd' },
  { id: 'frys',    name: 'Annen frossenmat',   mode: 'mnd' },
  { id: 'kjol',    name: 'Meieri og egg',      mode: 'behov' },
  { id: 'frukt',   name: 'Frukt og grønt',     mode: 'behov' },
  { id: 'krydder', name: 'Krydder og sauser',  mode: 'mnd' },
  { id: 'drikke',  name: 'Drikke',             mode: 'mnd' },
  { id: 'hush',    name: 'Husholdning',        mode: 'mnd' },
  { id: 'annet',   name: 'Annet',              mode: 'mnd' },
];
const UNITS = ['stk', 'pk', 'boks', 'pose', 'flaske', 'kg', 'g', 'l', 'dl', 'rull'];
const DECIMAL_UNITS = ['kg', 'l'];
const DAY = 864e5;
const STARTER = [
  ['Pasta','torr','pk',4], ['Ris','torr','pk',2], ['Havregryn','torr','pk',2], ['Hvetemel','torr','kg',2],
  ['Sukker','torr','kg',1], ['Kaffe','torr','pk',3], ['Knekkebrød','torr','pk',2],
  ['Hermetiske tomater','herm','boks',6], ['Kokosmelk','herm','boks',2], ['Syltetøy','herm','stk',1],
  ['Kjøttdeig','kjott','pk',6], ['Kyllingfilet','kjott','pk',4], ['Pølser','kjott','pk',2],
  ['Laks','fisk','pk',2], ['Fiskepinner','fisk','pk',2], ['Brød','brod','stk',4], ['Pizza','frys','stk',2],
  ['Melk','kjol','l',3], ['Smør','kjol','pk',1], ['Ost','kjol','stk',1], ['Egg','kjol','pk',1], ['Yoghurt','kjol','stk',4],
  ['Poteter','frukt','kg',2], ['Løk','frukt','stk',4], ['Gulrøtter','frukt','pose',1], ['Epler','frukt','stk',6], ['Bananer','frukt','stk',6],
  ['Ketchup','krydder','flaske',1], ['Buljong','krydder','pk',1],
  ['Toalettpapir','hush','pk',1], ['Oppvaskmiddel','hush','flaske',1], ['Vaskemiddel','hush','pk',1],
];

/* ---------- Lagring ---------- */
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { items: d.items || [], log: d.log || [], draft: d.draft || {}, dinners: d.dinners || [], plan: d.plan || {}, extras: d.extras || [], settings: d.settings || {} };
    }
  } catch (e) { /* tom start */ }
  return { items: [], log: [], draft: {}, dinners: [], plan: {}, extras: [], settings: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Klarte ikke å lagre på denne enheten.'); }
  try { scheduleSync(); } catch (e) { /* synkronisering er ikke lastet ennå */ }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Hjelpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const item = id => S.items.find(i => i.id === id);
const round2 = n => Math.round(n * 100) / 100;
const fmt = n => round2(n).toLocaleString('nb-NO', { maximumFractionDigits: 2 });
const roundUp = (n, unit) => DECIMAL_UNITS.includes(unit) ? Math.ceil(n * 2) / 2 : Math.ceil(n - 1e-9);
const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthName = key => { const [y, m] = key.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('nb-NO', { month: 'long', year: 'numeric' }); };
const shiftMonth = (key, n) => { const [y, m] = key.split('-'); return monthKey(new Date(+y, +m - 1 + n, 1)); };
const dateStr = ts => new Date(ts).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
const byName = (a, b) => a.name.localeCompare(b.name, 'nb');

/* Gjennomsnittlig forbruk per 30 dager, basert på de siste 90 dagene
   (eller kortere hvis varen er nyere enn det). */
function monthlyUse(id) {
  const now = Date.now(), from = now - 90 * DAY;
  const entries = S.log.filter(e => e.item === id);
  if (!entries.length) return 0;
  const first = Math.min(...entries.map(e => e.ts));
  const days = Math.max(30, Math.min(90, (now - first) / DAY));
  const used = entries.filter(e => e.type === 'bruk' && e.ts >= from).reduce((s, e) => s - e.delta, 0);
  return used / days * 30;
}

function status(it) {
  if (it.qty <= 0) return 'empty';
  if (it.target > 0 && it.qty < it.target) return 'low';
  return 'ok';
}

/* ---------- Endringer i beholdning ---------- */
let lastEntry = null;
function change(id, type, amount, silent) {
  const it = item(id);
  if (!it || !amount) return;
  let delta;
  if (type === 'kjøp') delta = amount;
  else if (type === 'bruk') delta = -Math.min(amount, it.qty);
  else delta = amount - it.qty; // justering: amount = ny beholdning
  delta = round2(delta);
  if (!delta) { if (type === 'bruk' && !silent) toast(`${it.name} er allerede tom`); return; }
  it.qty = round2(it.qty + delta);
  const e = { id: uid(), item: id, type, delta, ts: Date.now() };
  S.log.push(e);
  save();
  if (!silent) {
    lastEntry = e;
    const verb = type === 'kjøp' ? 'Kjøpt' : type === 'bruk' ? 'Brukt' : 'Justert';
    toast(`${verb} ${fmt(Math.abs(delta))} ${it.unit} ${it.name}`, true);
  }
  return e;
}
function undoEntry(entryId) {
  const idx = S.log.findIndex(e => e.id === entryId);
  if (idx < 0) return;
  const e = S.log[idx], it = item(e.item);
  if (it) it.qty = Math.max(0, round2(it.qty - e.delta));
  S.log.splice(idx, 1);
  save();
}

/* ---------- Egne dialoger (erstatter confirm/prompt) ---------- */
function ask(msg, okLabel = 'OK', danger = false) {
  const d = $('#ask');
  d.innerHTML = `<div class="dlg-body"><p>${esc(msg)}</p></div>
    <div class="dlg-foot"><button class="btn" id="ask-no">Avbryt</button><button class="btn ${danger ? 'danger' : 'primary'}" id="ask-yes">${esc(okLabel)}</button></div>`;
  return new Promise(res => {
    const done = v => { d.close(); res(v); };
    $('#ask-no').onclick = () => done(false);
    $('#ask-yes').onclick = () => done(true);
    d.oncancel = () => res(false);
    d.showModal();
  });
}
function showText(title, text) {
  const d = $('#ask');
  d.innerHTML = `<div class="dlg-head"><h3>${esc(title)}</h3><button class="x" id="ask-x" aria-label="Lukk">×</button></div>
    <div class="dlg-body"><textarea id="ask-text" readonly></textarea></div>

/* ---------- Middagsplan: hjelpere ---------- */
const WEEKDAYS = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn'];
const dinner = id => S.dinners.find(d => d.id === id);
const daysIn = key => { const [y, m] = key.split('-'); return new Date(+y, +m, 0).getDate(); };
const dayDate = (key, d) => { const [y, m] = key.split('-'); return new Date(+y, +m - 1, d); };
const todayStart = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const getDay = (key, d) => (S.plan[key] && S.plan[key][d]) || {};
function setDay(key, d, patch) {
  const m = S.plan[key] || (S.plan[key] = {});
  const v = { ...(m[d] || {}), ...patch };
  for (const k of Object.keys(v)) if (!v[k]) delete v[k];
  if (Object.keys(v).length) m[d] = v; else delete m[d];
  save();
}
let planMode = 'middag';
let listMode = 'handle';

/* Hvor mye av hver vare middagene trenger mellom to datoer (begge med).
   Middager som er merket som laget er allerede trukket fra lageret. */
function planNeed(from, to) {
  const need = {};
  for (const t = new Date(from); t <= to; t.setDate(t.getDate() + 1)) {
    const day = getDay(monthKey(t), t.getDate());
    if (day.away || day.cooked || !day.dinner) continue;
    const dn = dinner(day.dinner);
    if (!dn) continue;
    for (const g of dn.ings) need[g.item] = (need[g.item] || 0) + g.amt;
  }
  return need;
}
/* ---------- Planperiode: måned (fra valgt dato) eller uke ---------- */
const calView = () => S.settings.calView === 'uke' ? 'uke' : 'maned';
const startDay = () => Math.min(28, Math.max(1, +S.settings.startDay || 1));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const getDayAt = date => getDay(monthKey(date), date.getDate());
const setDayAt = (date, patch) => setDay(monthKey(date), date.getDate(), patch);
const fmtD = (d, o) => d.toLocaleDateString('nb-NO', o);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / DAY + 1) / 7);
}
function periodContaining(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  if (calView() === 'uke') { const s = addDays(d, -((d.getDay() + 6) % 7)); return { start: s, end: addDays(s, 6) }; }
  const sd = startDay();
  let s = new Date(d.getFullYear(), d.getMonth(), sd);
  if (d < s) s = new Date(d.getFullYear(), d.getMonth() - 1, sd);
  return { start: s, end: addDays(new Date(s.getFullYear(), s.getMonth() + 1, sd), -1) };
}
function shiftPeriod(p, n) {
  return calView() === 'uke' ? periodContaining(addDays(p.start, 7 * n))
    : periodContaining(new Date(p.start.getFullYear(), p.start.getMonth() + n, startDay()));
}
// Når det er under 10 dager igjen av en månedsperiode, planlegger man som regel den neste
function defaultPeriod() {
  const p = periodContaining(new Date());
  return calView() === 'maned' && (p.end - todayStart()) / DAY < 10 ? shiftPeriod(p, 1) : p;
}
let period = null;
const curPeriod = () => period || (period = defaultPeriod());
function periodDays(p) { const out = []; for (let t = new Date(p.start); t <= p.end; t = addDays(t, 1)) out.push(t); return out; }
function periodLabel(p) {
  if (calView() === 'uke') return `Uke ${isoWeek(p.start)} · ${fmtD(p.start, { day: 'numeric', month: 'short' })} – ${fmtD(p.end, { day: 'numeric', month: 'short' })}`;
  if (p.start.getDate() === 1) return cap(monthName(monthKey(p.start)));
  return `${fmtD(p.start, { day: 'numeric', month: 'short' })} – ${fmtD(p.end, { day: 'numeric', month: 'short', year: 'numeric' })}`;
}
// Kort form til setninger: «i november», «i uke 47», «i perioden»
function periodShort(p) {
  if (calView() === 'uke') return `i uke ${isoWeek(p.start)}`;
  return p.start.getDate() === 1 ? `i ${monthName(monthKey(p.start)).split(' ')[0]}` : 'i perioden';
}
const periodName = () => calView() === 'uke' ? 'uke' : 'periode';
function periodPlanNeed() {
  const p = curPeriod(), t = todayStart();
  return planNeed(p.start < t ? t : p.start, p.end);
}
function weekPlanNeed() {
  const t = todayStart(), e = new Date(t);
  e.setDate(e.getDate() + 6);
  return planNeed(t, e);
}

function findOrCreateItem(name, c, unit) {

}

/* ---------- Utskrift og bilde av kalenderen ---------- */
// Periodens dager som uker (mandag først); dager utenfor perioden er null
function calWeeks(p) {
  const first = addDays(p.start, -((p.start.getDay() + 6) % 7));
  const weeks = [];
  for (let t = first; t <= p.end; t = addDays(t, 7)) {
    weeks.push(Array.from({ length: 7 }, (_, i) => { const d = addDays(t, i); return d < p.start || d > p.end ? null : d; }));
  }
  return weeks;
}
function dayLabel(t) {
  const day = getDayAt(t), dn = day.dinner && dinner(day.dinner);
  return { away: !!day.away, text: day.away ? 'Borte' : dn ? dn.name : day.note || '' };
}
const dayNum = (t, p) => t.getDate() === 1 || t.getTime() === p.start.getTime() ? `${t.getDate()}. ${fmtD(t, { month: 'short' }).replace('.', '')}` : String(t.getDate());
const WEEKDAYS_LONG = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
const calTitle = p => calView() === 'uke' ? `Middager uke ${isoWeek(p.start)}` : p.start.getDate() === 1 ? `Middager i ${monthName(monthKey(p.start))}` : `Middager ${periodLabel(p)}`;

function printCalendar(p) {
  const weeks = calWeeks(p);
  const rowH = Math.min(60, Math.floor(145 / weeks.length));
  $('#print').innerHTML = `<h1>${esc(calTitle(p))}</h1>
    <table><thead><tr>${WEEKDAYS_LONG.map(w => `<th>${w}</th>`).join('')}</tr></thead><tbody>
    ${weeks.map(w => `<tr style="height:${rowH}mm">${w.map(t => {
      if (!t) return '<td class="empty"></td>';
      const l = dayLabel(t);
      return `<td class="${l.away ? 'away' : ''}"><b>${dayNum(t, p)}</b><span>${esc(l.text)}</span></td>`;
    }).join('')}</tr>`).join('')}
    </tbody></table>
    <p>Laget med Matplanlegging</p>`;
  window.print();
}

function wrapText(ctx, text, maxW, maxLines) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  const push = l => { lines.push(l); };
  for (let w of words) {
    // Del opp ord som er bredere enn ruten
    while (ctx.measureText(w).width > maxW) {
      let k = w.length - 1;
      while (k > 1 && ctx.measureText(w.slice(0, k) + '-').width > maxW) k--;
      if (line) { push(line); line = ''; }
      push(w.slice(0, k) + '-');
      w = w.slice(k);
    }
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW) line = test;
    else { push(line); line = w; }
  }
  if (line) push(line);
  if (lines.length > maxLines) {
    const cut = lines.slice(0, maxLines);
    let last = cut[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    cut[maxLines - 1] = last + '…';
    return cut;
  }
  return lines;
}

function drawCalendar(p) {
  const weeks = calWeeks(p);
  const W = 1600, pad = 48, headH = 110, wdH = 44, cellW = (W - pad * 2) / 7, cellH = weeks.length === 1 ? 320 : 190;
  const H = pad + headH + wdH + cellH * weeks.length + 70;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const font = (w, px) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = '#f6f4ee'; ctx.fillRect(0, 0, W, H);
  // Tittel
  ctx.fillStyle = '#1f2a22'; ctx.font = font(700, 56); ctx.textBaseline = 'top';
  ctx.fillText(cap(calTitle(p)), pad, pad);
  // Ukedager
  ctx.font = font(600, 22); ctx.fillStyle = '#6b756d';
  WEEKDAYS_LONG.forEach((w, i) => ctx.fillText(w.toUpperCase(), pad + i * cellW + 12, pad + headH));
  const top = pad + headH + wdH;
  const today = todayStart().getTime();
  weeks.forEach((w, r) => w.forEach((t, i) => {
    if (!t) return;
    const x = pad + i * cellW, y = top + r * cellH, l = dayLabel(t);
    ctx.fillStyle = l.away ? '#e9e6dc' : l.text ? '#e7efe8' : '#ffffff';
    ctx.fillRect(x + 3, y + 3, cellW - 6, cellH - 6);
    if (t.getTime() === today) { ctx.strokeStyle = '#3f6b4a'; ctx.lineWidth = 4; ctx.strokeRect(x + 5, y + 5, cellW - 10, cellH - 10); }
    else { ctx.strokeStyle = '#e3e0d6'; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 3, cellW - 6, cellH - 6); }
    ctx.fillStyle = '#1f2a22'; ctx.font = font(700, 28);
    ctx.fillText(dayNum(t, p), x + 16, y + 14);
    if (l.text) {
      ctx.font = l.away ? font('italic 400', 26) : font(600, 28);
      ctx.fillStyle = l.away ? '#6b756d' : '#2f5638';
      wrapText(ctx, l.text, cellW - 32, weeks.length === 1 ? 8 : 4).forEach((line, k) => ctx.fillText(line, x + 16, y + 58 + k * 32));
    }
  }));
  ctx.fillStyle = '#6b756d'; ctx.font = font(400, 22);
  ctx.fillText('Laget med Matplanlegging', pad, H - 50);
  return c;
}

async function shareCalendarImage(p) {
  const blob = await new Promise(res => drawCalendar(p).toBlob(res, 'image/png'));
  const name = `middager-${isoDate(p.start)}.png`;
  try {
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: calTitle(p) });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Bildet er lagret i Nedlastinger');
}

/* ---------- Middagstips ---------- */
let dinnerQ = '';
const norm = s => s.toLowerCase().trim();
// Alle søkeordene må finnes i navnet eller i en av ingrediensene
function dinnerMatches(dn, q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const ingNames = dn.ings.map(g => item(g.item)).filter(Boolean).map(it => norm(it.name));
  return terms.every(t => norm(dn.name).includes(t) || ingNames.some(n => n.includes(t)));
}
function ingText(dn, q, sep) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  return dn.ings.map(g => {
    const it = item(g.item);
    if (!it) return '';
    const txt = `${esc(it.name)} ${fmt(g.amt)} ${esc(it.unit)}`;
    return terms.some(t => norm(it.name).includes(t)) ? `<b class="hit">${txt}</b>` : txt;
  }).filter(Boolean).join(sep);
}
function viewMiddager() {

          <div id="ings" style="display:grid;gap:8px"></div>
        </div>
        <button type="button" class="btn small" id="add-ing" style="justify-self:start">+ Ingrediens</button>
        <p class="hint" style="margin:0">Skriv navnet på en vare fra lageret, eller et nytt navn. Nye varer legges til på lageret når du lagrer.</p>
        <datalist id="itemlist">${S.items.slice().sort(byName).map(i => `<option value="${esc(i.name)}">`).join('')}</datalist>
      </div>
      <div class="dlg-foot">
        ${dn ? '<button type="button" class="btn danger" id="del" style="margin-right:auto">Slett</button>' : ''}
        <button type="button" class="btn" id="cancel">Avbryt</button>
        <button type="submit" class="btn primary">Lagre</button>
      </div>

  const read = () => [...dlg.querySelectorAll('.ing')].map(el => ({
    name: el.querySelector('.ing-name').value,
    amt: parseFloat(el.querySelector('.ing-amt').value) || 0,

  }));
  const draw = () => {
    $('#ings').innerHTML = rows.map(rowHtml).join('');
    dlg.querySelectorAll('.ing').forEach(el => {

      el.querySelector('.ing-del').onclick = () => { rows = read(); rows.splice(k, 1); if (!rows.length) rows.push({ name: '', amt: 1, unit: 'stk', cat: 'annet' }); draw(); };

    else S.dinners.push({ id: uid(), name, ings });
    save(); close(); render();
  };
  dlg.showModal();
  if (!dn) $('#name').focus();
}

/* ---------- Handleliste ---------- */
function suggestions() {
  const mnd = [], behov = [];
  const month = periodPlanNeed(), week = weekPlanNeed();
  for (const i of S.items) {
    if (i.mode === 'behov') {
      const p7 = week[i.id] || 0;
      if ((i.target > 0 && i.qty < i.target) || p7 > i.qty) {
        const amt = roundUp(Math.max(1, Math.max(i.target, p7) - i.qty), i.unit);
        const why = (i.qty <= 0 ? 'tomt' : `${fmt(i.qty)} igjen`) + (p7 ? ` · middager neste 7 dager: ${fmt(p7)}` : '');
        behov.push({ i, amt, why });
      }
    } else {
      const avg = monthlyUse(i.id), plan = month[i.id] || 0;
      const want = Math.max(i.target, avg, plan);
      if (want - i.qty > 0.01) {
        const why = plan >= want ? `middagsplanen trenger ${fmt(plan)}` : avg >= want ? `bruker ca. ${fmt(avg)}/mnd` : `ønsket ${fmt(i.target)}`;
        mnd.push({ i, amt: roundUp(want - i.qty, i.unit), why: `${why}, har ${fmt(i.qty)}` });
      }
    }
  }
  return { mnd, behov, month };
}

  const draft = r => S.draft[r.i.id] || { on: false, amt: r.amt };
  const grouped = (rows, rowFn) => CATS.map(c => ({ c, rows: rows.filter(r => r.i.cat === c.id).sort((a, b) => byName(a.i, b.i)) }))
    .filter(g => g.rows.length).map(g => `<div class="grp">${g.c.name}</div>` + g.rows.map(rowFn).join('')).join('');
  const steps = `<div class="steps">

  const planNote = planDays

  if (listMode === 'sjekk') {
    const ids = new Set([...mnd, ...behov].map(r => r.i.id).concat(Object.keys(month)));

        <input type="number" class="list-amt" inputmode="decimal" min="0" step="any" data-have="${r.i.id}" value="${r.i.qty}" aria-label="Har nå av ${esc(r.i.name)}">
        <span class="sub" style="width:42px">${esc(r.i.unit)}</span>
      </div>`) : '<div class="row sub">Ingenting å sjekke.</div>'}
      </section>
      <button class="btn primary" id="checked-done" style="width:100%">Ferdig, vis handlelisten</button>`;
    document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { listMode = b.dataset.lm; render(); });
    document.querySelectorAll('[data-have]').forEach(inp => inp.onchange = () => {
      change(inp.dataset.have, 'justering', Math.max(0, parseFloat(inp.value) || 0), true);
      delete S.draft[inp.dataset.have];
      save();
    });
    $('#checked-done').onclick = () => { listMode = 'handle'; render(); window.scrollTo(0, 0); };
    return;
  }

  // Én felles radmodell for forslag og egne tillegg
  const toRow = r => ({ key: r.i.id, itemId: r.i.id, name: r.i.name, unit: r.i.unit, cat: r.i.cat, why: r.why, amt: r.amt });
  const extraRows = S.extras.map(x => {
    const it = x.item && item(x.item);
    return { key: 'x:' + x.id, extraId: x.id, itemId: it ? it.id : null, name: it ? it.name : x.name, unit: it ? it.unit : x.unit, cat: it ? it.cat : 'annet', why: 'lagt til selv', amt: x.amt };
  });
  const mndRows = mnd.map(toRow), behovRows = behov.map(toRow);
  const all = [...mndRows, ...behovRows, ...extraRows];
  const view = S.settings.listView || 'oppdelt';
  const draftOf = r => S.draft[r.key] || { on: false, amt: r.amt };
  const byCat = rows => CATS.map(c => ({ c, rows: rows.filter(r => r.cat === c.id).sort((a, b) => a.name.localeCompare(b.name, 'nb')) })).filter(g => g.rows.length);
  const rowHtml = r => {
    const d = draftOf(r);
    return `<div class="row ${d.on ? 'done' : ''}">
      <input type="checkbox" class="check" data-chk="${esc(r.key)}" ${d.on ? 'checked' : ''} aria-label="Lagt i kurven">
      <div class="grow"><span class="name" style="cursor:default">${esc(r.name)}</span><div class="sub">${esc(r.why)}</div></div>

      <span class="sub" style="width:42px">${esc(r.unit)}</span>
      ${r.extraId ? `<button class="x" data-rmx="${r.extraId}" aria-label="Fjern fra listen">×</button>` : ''}
    </div>`;
  };
  const section = (title, rows, note) => rows.length
    ? `<section class="card"><h2>${title}<span>${rows.length}</span></h2>` + byCat(rows).map(g => `<div class="grp">${g.c.name}</div>` + g.rows.map(rowHtml).join('')).join('') + `</section>`
    : note ? `<section class="card"><h2>${title}</h2><div class="row sub">${note}</div></section>` : '';
  const lists = view === 'enkelt'
    ? section('Handleliste', all, 'Ingenting på listen ennå. Legg til varer under.')
    : section('Månedshandel', mndRows, 'Du har nok av alt du månedshandler.')
      + section('Fylles på ved behov', behovRows, 'Ingen meieri, frukt eller grønt trengs den neste uken.')
      + section('Lagt til selv', extraRows, '');

  const checked = all.filter(r => S.draft[r.key]?.on).length;
  $('#view').innerHTML = `${steps}

    </div>
    ${lists}
    <section class="card"><h2>Legg til på listen</h2>
      <form id="xform" class="row" style="flex-wrap:wrap">
        <input type="text" id="x-name" list="x-items" placeholder="F.eks. bursdagskake, batterier" autocomplete="off" style="flex:1 1 160px" aria-label="Vare">
        <input type="number" id="x-amt" inputmode="decimal" min="0" step="any" value="1" style="width:64px;flex:none" aria-label="Antall">

    </section>
  `;

  const byKey = Object.fromEntries(all.map(r => [r.key, r]));
  const setDraft = (key, patch) => { S.draft[key] = { ...draftOf(byKey[key]), ...patch }; save(); };
  document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { listMode = b.dataset.lm; render(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.settings.listView = b.dataset.view; save(); render(); });
  document.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { setDraft(c.dataset.chk, { on: c.checked }); render(); });
  document.querySelectorAll('[data-amt]').forEach(inp => inp.onchange = () => setDraft(inp.dataset.amt, { amt: Math.max(0, parseFloat(inp.value) || 0) }));
  document.querySelectorAll('[data-rmx]').forEach(b => b.onclick = () => {
    S.extras = S.extras.filter(x => x.id !== b.dataset.rmx);

  const matchItem = name => S.items.find(i => i.name.toLowerCase() === name.trim().toLowerCase());

  $('#xform').onsubmit = ev => {
    ev.preventDefault();
    const name = $('#x-name').value.trim();
    if (!name) return;
    const it = matchItem(name);
    S.extras.push({ id: uid(), name, amt: Math.max(0, parseFloat($('#x-amt').value) || 1), unit: it ? it.unit : $('#x-unit').value, item: it ? it.id : null });

  $('#register').onclick = () => {

      if (r.extraId) S.extras = S.extras.filter(x => x.id !== r.extraId);
      n++;
    }
    for (const r of all) delete S.draft[r.key];
    save(); render();
    toast(`${n} ${n === 1 ? 'vare' : 'varer'} registrert som kjøpt`);
  };
  $('#share').onclick = async () => {
    const lines = [`Handleliste – ${periodLabel(curPeriod())}`];
    const add = (title, rows) => {
      if (!rows.length) return;
      if (title) lines.push('', '== ' + title.toUpperCase() + ' ==');
      for (const g of byCat(rows)) {
        lines.push('', g.c.name + ':');
        g.rows.forEach(r => lines.push(`☐ ${r.name} – ${fmt(draftOf(r).amt)} ${r.unit}`));

    const text = lines.join('\n');
    if (navigator.share) {
      try { await navigator.share({ title: 'Handleliste', text }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    showText('Handleliste', text);
  };
}

function viewHistorikk() {
  $('#title').textContent = 'Historikk';

  const entries = S.log.filter(e => monthKey(e.ts) === histMonth);

  for (const e of entries) {
    const p = per[e.item] || (per[e.item] = { kjøpt: 0, brukt: 0 });
    if (e.type === 'kjøp') p.kjøpt += e.delta;
    else if (e.type === 'bruk') p.brukt -= e.delta;

    .sort((a, b) => b.brukt - a.brukt || byName(a.it, b.it));

  $('#view').innerHTML = `
    <div class="monthbar">
      <button class="btn small" id="prev" aria-label="Forrige måned">‹</button>
      <strong>${monthName(histMonth)}</strong>

      ${rows.map(r => `<tr><td>${esc(r.it.name)}</td><td class="pos">${r.kjøpt ? fmt(r.kjøpt) + ' ' + esc(r.it.unit) : '–'}</td><td class="neg">${r.brukt ? fmt(r.brukt) + ' ' + esc(r.it.unit) : '–'}</td></tr>`).join('')}
      </tbody></table></section>` : `<div class="card empty-state">Ingen registreringer i ${monthName(histMonth)}.</div>`}
    ${recent.length ? `<section class="card"><h2>Siste registreringer</h2>
      ${recent.map(e => { const it = item(e.item); return it ? `<div class="row">
        <div class="grow"><div>${esc(it.name)} <span class="${e.delta > 0 ? 'pos' : 'neg'}">${e.delta > 0 ? '+' : ''}${fmt(e.delta)} ${esc(it.unit)}</span></div>
        <div class="sub">${dateStr(e.ts)} · ${e.type}</div></div>
        <button class="undo" data-undo="${e.id}">Angre</button></div>` : ''; }).join('')}
    </section>` : ''}`;

  $('#prev').onclick = () => { histMonth = shiftMonth(histMonth, -1); render(); };
  $('#nextm').onclick = () => { histMonth = shiftMonth(histMonth, 1); render(); };
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    if (!await ask('Angre denne registreringen? Beholdningen endres tilbake.', 'Angre')) return;
    undoEntry(b.dataset.undo); render();
  });
}

/* ---------- Synkronisering via husstandens egen Supabase ---------- */
const SYNC_KEY = 'matplan.sync', BASE_KEY = 'matplan.syncbase';
const SYNC_SQL = `-- Matplanlegging: synkronisering for husstanden
create table if not exists public.matplan_sync (
  id text primary key,
  data jsonb not null,
  version bigint not null default 1,
  updated_at timestamptz not null default now(),
  updated_by text
);
-- Ingen tilgang direkte til tabellen, bare via funksjonene under
alter table public.matplan_sync enable row level security;
revoke all on public.matplan_sync from anon, authenticated;

create or replace function public.matplan_get(p_id text)
returns table(data jsonb, version bigint, updated_at timestamptz, updated_by text)
language sql security definer set search_path = public as $$
  select data, version, updated_at, updated_by from matplan_sync where id = p_id;
$$;

create or replace function public.matplan_put(p_id text, p_data jsonb, p_base bigint, p_by text)
returns bigint
language plpgsql security definer set search_path = public as $$
declare v bigint;
begin
  if length(p_id) < 20 then raise exception 'Husstandskoden er for kort'; end if;
  insert into matplan_sync as m (id, data, version, updated_by) values (p_id, p_data, 1, p_by)
  on conflict (id) do update
    set data = excluded.data, version = m.version + 1, updated_at = now(), updated_by = excluded.updated_by
    where m.version = p_base
  returning m.version into v;
  return v; -- null betyr at noen andre lagret først
end $$;

grant execute on function public.matplan_get(text) to anon;
grant execute on function public.matplan_put(text, jsonb, bigint, text) to anon;`;

let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } })();
const saveSY = () => { try { SY ? localStorage.setItem(SYNC_KEY, JSON.stringify(SY)) : localStorage.removeItem(SYNC_KEY); } catch (e) { /* ignorer */ } };
const getBase = () => { try { return JSON.parse(localStorage.getItem(BASE_KEY)) || emptyState(); } catch (e) { return emptyState(); } };
const setBase = st => { try { localStorage.setItem(BASE_KEY, JSON.stringify(st)); } catch (e) { /* ignorer */ } };
function emptyState() { return { items: [], log: [], draft: {}, dinners: [], plan: {}, extras: [], settings: {} }; }
function normState(d) { const e = emptyState(); for (const k of Object.keys(e)) if (d && d[k] !== undefined) e[k] = d[k]; return e; }

let syncState = { busy: false, error: '', timer: null };

async function rpc(fn, body, cfg = SY) {
  const headers = { 'Content-Type': 'application/json', apikey: cfg.key };
  if (cfg.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + cfg.key;
  let res;
  try {
    res = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(body), cache: 'no-store' });
  } catch (e) { throw new Error('Fikk ikke kontakt med Supabase. Sjekk nettet og adressen.'); }
  const txt = await res.text();
  let json = null; try { json = txt ? JSON.parse(txt) : null; } catch (e) { /* ikke JSON */ }
  if (!res.ok) {
    if (json && json.code === 'PGRST202') throw new Error('Fant ikke synkroniseringsfunksjonene. Har du kjørt SQL-koden i Supabase?');
    if (res.status === 401 || res.status === 403) throw new Error('Supabase godtok ikke nøkkelen. Bruk «publishable» eller «anon»-nøkkelen.');
    throw new Error((json && (json.message || json.hint)) || `Supabase svarte med feil (${res.status}).`);
  }
  return json;
}

/* Tre-veis sammenslåing: det som bare er endret ett sted, beholdes.
   Er samme ting endret begge steder, vinner denne telefonen, men
   lagerbeholdningen slås sammen (begge endringene telles med). */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function mergeMap(base, local, remote, both) {
  const out = {};
  for (const k of new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)])) {
    const b = base[k], l = local[k], r = remote[k];
    const lc = !same(b, l), rc = !same(b, r);
    const v = !lc ? r : !rc ? l : (l !== undefined && r !== undefined && both) ? both(b, l, r) : (l !== undefined ? l : r);
    if (v !== undefined) out[k] = v;
  }
  return out;
}
const byIdMap = arr => Object.fromEntries((arr || []).map(x => [x.id, x]));
const flatPlan = plan => { const o = {}; for (const [m, days] of Object.entries(plan || {})) for (const [d, v] of Object.entries(days)) o[m + '|' + d] = v; return o; };
function mergeStates(base, local, remote) {
  const items = mergeMap(byIdMap(base.items), byIdMap(local.items), byIdMap(remote.items), (b, l, r) =>
    ({ ...l, qty: Math.max(0, round2(r.qty + l.qty - (b ? b.qty : 0))) }));
  const plan = {};
  for (const [k, v] of Object.entries(mergeMap(flatPlan(base.plan), flatPlan(local.plan), flatPlan(remote.plan)))) {
    const [m, d] = k.split('|'); (plan[m] || (plan[m] = {}))[d] = v;
  }
  return {
    items: Object.values(items),
    log: Object.values(mergeMap(byIdMap(base.log), byIdMap(local.log), byIdMap(remote.log))).sort((a, b) => a.ts - b.ts),
    dinners: Object.values(mergeMap(byIdMap(base.dinners), byIdMap(local.dinners), byIdMap(remote.dinners))),
    extras: Object.values(mergeMap(byIdMap(base.extras), byIdMap(local.extras), byIdMap(remote.extras))),
    draft: mergeMap(base.draft || {}, local.draft || {}, remote.draft || {}),
    settings: mergeMap(base.settings || {}, local.settings || {}, remote.settings || {}),
    plan,
  };
}

function scheduleSync(delay = 1500) {
  if (!SY) return;
  clearTimeout(syncState.timer);
  syncState.timer = setTimeout(() => syncNow(), delay);
}

async function syncNow(manual) {
  if (!SY || syncState.busy) return;
  if (!navigator.onLine) { syncState.error = 'Ingen nettforbindelse. Endringene sendes når du er på nett igjen.'; refreshSyncCard(); return; }
  syncState.busy = true; refreshSyncCard();
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const rows = await rpc('matplan_get', { p_id: SY.code });
      const remote = rows && rows[0];
      const base = getBase();
      let next = S, baseVersion = SY.version || 0;
      if (remote && remote.version !== SY.version) {
        // Noen andre har lagret siden sist: slå sammen
        next = mergeStates(base, S, normState(remote.data));
        baseVersion = remote.version;
        SY.lastBy = remote.updated_by;
        if (!same(next, S)) { S = next; persistLocal(); render(); }
        if (same(next, normState(remote.data))) { SY.version = remote.version; setBase(next); break; }
      } else if (remote && same(S, base)) {
        break; // ingenting nytt noen steder
      }
      const v = await rpc('matplan_put', { p_id: SY.code, p_data: next, p_base: remote ? baseVersion : 0, p_by: SY.device || 'Ukjent telefon' });
      if (v !== null && v !== undefined) { SY.version = v; SY.lastBy = SY.device; setBase(next); break; }
      // Noen lagret samtidig, prøv på nytt
    }
    SY.last = Date.now(); syncState.error = ''; saveSY();
    if (manual) toast('Synkronisert');
  } catch (e) {
    syncState.error = e.message;
    if (manual) toast(e.message);
  } finally {
    syncState.busy = false; refreshSyncCard();
  }
}

// Lagrer lokalt uten å starte en ny synkronisering
function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignorer */ } }

const randomCode = () => Array.from(crypto.getRandomValues(new Uint8Array(18)), b => b.toString(16).padStart(2, '0')).join('');
const encodeSetup = cfg => 'MATPLAN-' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: cfg.url, k: cfg.key, c: cfg.code }))));
function decodeSetup(txt) {
  const m = String(txt).trim().match(/MATPLAN-([A-Za-z0-9+/=]+)/);
  if (!m) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return o.u && o.k && o.c ? { url: o.u, key: o.k, code: o.c } : null; } catch (e) { return null; }
}

function syncCardHtml() {
  const timeStr = ts => new Date(ts).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  if (SY) {
    return `<section class="card" id="sync-card"><h2>Synkronisering<span>${syncState.busy ? 'synkroniserer …' : 'på'}</span></h2>
      <div class="row"><div class="grow sub">
        ${syncState.error ? `<p style="margin:0 0 6px;color:var(--danger)">${esc(syncState.error)}</p>` : ''}
        <p style="margin:0">Denne telefonen: <b>${esc(SY.device || 'Ukjent telefon')}</b>${SY.last ? `<br>Sist synkronisert ${timeStr(SY.last)}${SY.lastBy && SY.lastBy !== SY.device ? ` · siste endring fra ${esc(SY.lastBy)}` : ''}` : ''}</p>
      </div></div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn primary" id="sync-now">Synkroniser nå</button>
        <button class="btn" id="sync-share">Del oppsett med husstanden</button>
        <button class="btn small danger" id="sync-off" style="margin-left:auto">Slå av</button>
      </div>
    </section>`;
  }
  return `<section class="card" id="sync-card"><h2>Synkronisering<span>av</span></h2>
    <div class="row"><div class="grow sub">
      <p style="margin:0 0 8px">Del plan, middagstips, lager og handleliste mellom telefonene i husstanden. Dette krever en gratis konto hos Supabase, og passer for deg som er litt teknisk.</p>
      <p style="margin:0"><b>Har noen i husstanden allerede satt det opp?</b> Be om oppsettkoden og lim den inn her.</p>
    </div></div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn primary" id="sync-join">Lim inn oppsettkode</button>
      <button class="btn" id="sync-setup">Sett opp ny</button>
    </div>
    <details class="row" style="display:block">
      <summary style="cursor:pointer;font-weight:600">Slik setter du opp Supabase</summary>
      <ol class="sub" style="margin:8px 0 0;padding-left:20px;display:grid;gap:6px">
        <li>Lag en gratis konto på <b>supabase.com</b> og trykk <b>New project</b>. Velg et navn og et passord, og region <b>Europe</b>.</li>
        <li>Når prosjektet er klart: åpne <b>SQL Editor</b> i menyen, lim inn SQL-koden under og trykk <b>Run</b>.</li>
        <li>Gå til <b>Project Settings → API Keys</b> (eller <b>Data API</b>). Kopier <b>Project URL</b> og nøkkelen som heter <b>publishable</b> (eller <b>anon</b>). Bruk aldri <b>secret</b>- eller <b>service_role</b>-nøkkelen.</li>
        <li>Trykk <b>Sett opp ny</b> over, og lim inn adressen og nøkkelen.</li>
        <li>Trykk <b>Del oppsett med husstanden</b> og send koden til de andre. De limer den inn i sin app.</li>
      </ol>
      <button class="btn small" id="sync-sql" style="margin-top:10px">Vis SQL-koden</button>
    </details>
  </section>`;
}
function refreshSyncCard() {
  const card = document.getElementById('sync-card');
  if (!card) return;
  card.outerHTML = syncCardHtml();
  bindSyncCard();
}
function bindSyncCard() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('sync-now', () => syncNow(true));
  on('sync-share', () => {
    const code = encodeSetup(SY);
    const text = `Oppsettkode for Matplanlegging (lim inn under Mer → Synkronisering):\n\n${code}`;
    if (navigator.share) navigator.share({ title: 'Matplanlegging – synkronisering', text }).catch(() => {});
    else showText('Oppsettkode', code);
  });
  on('sync-off', async () => {
    if (!await ask('Slå av synkronisering på denne telefonen? Dataene blir liggende her, men endringer deles ikke lenger.', 'Slå av', true)) return;
    SY = null; saveSY(); try { localStorage.removeItem(BASE_KEY); } catch (e) { /* ignorer */ }
    refreshSyncCard(); toast('Synkronisering er slått av');
  });
  on('sync-sql', () => showText('SQL-kode til Supabase', SYNC_SQL));
  on('sync-setup', () => openSyncDialog('setup'));
  on('sync-join', () => openSyncDialog('join'));
}

function openSyncDialog(mode) {
  const dlg = $('#dlg');
  dlg.onclose = null;
  dlg.innerHTML = `<form id="sf">
    <div class="dlg-head"><h3>${mode === 'setup' ? 'Sett opp synkronisering' : 'Bli med i husstanden'}</h3><button type="button" class="x" id="close" aria-label="Lukk">×</button></div>
    <div class="dlg-body">
      ${mode === 'setup' ? `
        <label class="f">Project URL<input type="url" id="s-url" placeholder="https://abcdefgh.supabase.co" required autocomplete="off"></label>
        <label class="f">Publishable- eller anon-nøkkel<input type="text" id="s-key" placeholder="sb_publishable_… eller eyJ…" required autocomplete="off"></label>
      ` : `
        <label class="f">Oppsettkode<textarea id="s-code" rows="4" placeholder="MATPLAN-…" required style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace"></textarea></label>
      `}
      <label class="f">Navn på denne telefonen<input type="text" id="s-dev" placeholder="F.eks. Silje" required autocomplete="off"></label>
      <p class="sub" id="s-err" style="margin:0;color:var(--danger)"></p>
    </div>
    <div class="dlg-foot"><button type="button" class="btn" id="cancel">Avbryt</button><button type="submit" class="btn primary" id="s-ok">Koble til</button></div>
  </form>`;
  const close = () => dlg.close();
  $('#close').onclick = close; $('#cancel').onclick = close;
  $('#sf').onsubmit = async ev => {
    ev.preventDefault();
    const err = msg => { $('#s-err').textContent = msg; $('#s-ok').disabled = false; };
    $('#s-ok').disabled = true; $('#s-err').textContent = 'Kobler til …';
    let cfg;
    if (mode === 'setup') {
      const url = $('#s-url').value.trim(), key = $('#s-key').value.trim();
      if (!/^https:\/\/.+/.test(url)) return err('Adressen må starte med https://');
      if (/^sb_secret_/.test(key) || /service_role/.test(atobSafe(key.split('.')[1] || ''))) return err('Dette er en hemmelig nøkkel. Bruk publishable- eller anon-nøkkelen.');
      cfg = { url, key, code: randomCode() };
    } else {
      cfg = decodeSetup($('#s-code').value);
      if (!cfg) return err('Koden ble ikke gjenkjent. Den skal starte med MATPLAN-.');
    }
    cfg.device = $('#s-dev').value.trim() || 'Ukjent telefon';
    let remote;
    try { remote = ((await rpc('matplan_get', { p_id: cfg.code }, cfg)) || [])[0]; }
    catch (e) { return err(e.message); }
    let replace = true;
    if (remote) {
      const hasLocal = S.items.length || S.dinners.length;
      if (hasLocal) {
        dlg.close();
        replace = await ask(`Husstanden har allerede ${normState(remote.data).dinners.length} middagstips og ${normState(remote.data).items.length} varer. Vil du bytte ut det som ligger på denne telefonen med husstandens data?\n\nVelger du Avbryt, slås dataene sammen i stedet.`, 'Bytt ut');
      }
      if (replace) { S = normState(remote.data); setBase(S); cfg.version = remote.version; }
      else { setBase(emptyState()); cfg.version = 0; }
      persistLocal();
    } else {
      setBase(emptyState()); cfg.version = 0;
    }
    SY = cfg; saveSY();
    if (dlg.open) dlg.close();
    await syncNow();
    render();
    toast(syncState.error ? syncState.error : 'Synkronisering er slått på');
  };
  dlg.showModal();
}
function atobSafe(s) { try { return atob(s.replace(/-/g, '+').replace(/_/g, '/')); } catch (e) { return ''; } }

// Synkroniser når appen åpnes, kommer tilbake i forgrunnen, eller får nett igjen
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(300); });
window.addEventListener('online', () => scheduleSync(300));
setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 60000);

render();
scheduleSync(500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
</body>
</html>
